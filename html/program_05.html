<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid example</title>
    <style>
      .container {
        background-color: aliceblue;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" style="background-color: black; padding: 50px">
      <div style="background-color: red">first</div>
      <div style="background-color: yellow">second</div>
      <div style="background-color: green">third</div>
      <div style="background-color: blue">fourth</div>
      <div style="background-color: brown">fifth</div>
    </div>
  </body>
</html>
