<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box example</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            /* margin: 10px; */
            padding: 30px;
        }

        #first {
            background-color: red;
        }

        #second {
            background-color: green;
        }

        #third {
            background-color: yellow;
            
        }

        .common-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #parent_div {
            /* 
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background-color: black;
        */

        display: flex;
        flex-direction: row-reverse;
        gap: 5px;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }
    </style>
</head>
<body>
    <div id="parent_div">
        <div id="first"  class="box common-box">first</div>
        <div id="second" class="box common-box">second</div>
        <div id="third" class="box common-box">third</div>
    </div>
</body>
</html>
